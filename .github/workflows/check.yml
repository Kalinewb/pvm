name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck nftables
      - run: ./check.sh
      - name: dist/ is up to date
        run: ./build.sh /tmp/pvm.sh && cmp /tmp/pvm.sh dist/pvm.sh
      - run: sudo bash tests/unit.sh dist/pvm.sh
